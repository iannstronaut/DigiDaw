<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none"
     stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <!-- DigiDAW Piano Roll Icon (DESIGN.md Premium Vector) -->
  <!-- Outer window border -->
  <rect x="3" y="3" width="18" height="18" rx="2.5" />

  <!-- Piano keyboard separator line -->
  <line x1="8.5" y1="3" x2="8.5" y2="21" />

  <!-- White key divisions -->
  <line x1="3" y1="9" x2="8.5" y2="9" stroke-width="1.2" />
  <line x1="3" y1="15" x2="8.5" y2="15" stroke-width="1.2" />

  <!-- Black key blocks -->
  <rect x="5.5" y="6" width="3" height="3" rx="0.5" fill="currentColor" stroke="none" />
  <rect x="5.5" y="12" width="3" height="3" rx="0.5" fill="currentColor" stroke="none" />

  <!-- Melodic MIDI note blocks on grid -->
  <rect x="11" y="5.5" width="5.5" height="2.5" rx="0.75" fill="currentColor" stroke="none" />
  <rect x="14" y="9.5" width="5" height="2.5" rx="0.75" fill="currentColor" stroke="none" />
  <rect x="11.5" y="13.5" width="6" height="2.5" rx="0.75" fill="currentColor" stroke="none" />
  <rect x="13" y="17" width="4.5" height="2.5" rx="0.75" fill="currentColor" stroke="none" />
</svg>
